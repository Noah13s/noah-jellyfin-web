name: Noah source player
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['noah-web-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      # Upstream's locked classlist.js tarball is a remote package with integrity.
      - run: npm ci --ignore-scripts --allow-remote=all --no-audit --no-fund
      - run: python3 -m unittest discover -s scripts -p test_unused.py
      - run: node scripts/verify-noah-source.mjs
      - run: node node_modules/eslint/bin/eslint.js --no-inline-config --config scripts/noah-lint.config.mjs 'src/plugins/noah/**/*.js'
      - run: mkdir -p coverage
      - run: node --experimental-test-coverage --test-coverage-include='**/src/plugins/noah/**' --test --test-reporter=spec --test-reporter=lcov --test-reporter-destination=stdout --test-reporter-destination=coverage/contracts-lcov.info test/contracts/*.cjs
      - run: npm run build:check
      - run: npm test -- --coverage --reporter=default --reporter=junit --outputFile.junit=test-results.xml
      - run: npm run build:production
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          JELLYFIN_VERSION: Noah-${{ github.sha }}
      - run: node scripts/noah-manifest.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noah-web-${{ github.sha }}
          path: dist/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: noah-web-tests-${{ github.sha }}
          path: |
            test-results.xml
            coverage/*.info
            coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 14
  sonar:
    if: vars.SONAR_CI_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: check-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: noah-web-tests-${{ github.sha }}
      - name: Require coverage and a configured analysis token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_TOKEN"
          test -s coverage/lcov.info
      - uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
